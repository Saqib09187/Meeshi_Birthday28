<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For Meeshi</title>
<meta name="theme-color" content="#08050f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#e9c46a; --gold-hi:#fff1c1; --gold-lo:#b8862b;
  --rose:#ff8fb1; --ink:#f7f1ff; --mute:rgba(247,241,255,.68);
  --bg:#08050f; --tint:rgba(120,60,180,.35); --tint2:rgba(190,50,110,.30); --vh:1vh;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --script:'Great Vibes','Playfair Display',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;font-family:inherit}
body[data-theme="eid"]{--tint:rgba(16,140,120,.34);--tint2:rgba(200,160,60,.22)}
body[data-theme="newyear"]{--tint:rgba(40,80,200,.34);--tint2:rgba(233,196,106,.20)}
body[data-theme="love"]{--tint:rgba(200,50,110,.34);--tint2:rgba(120,50,170,.28)}
body[data-theme="birthday"]{--tint:rgba(130,60,200,.36);--tint2:rgba(255,120,160,.26)}
body[data-theme="engagement"]{--tint:rgba(220,150,70,.30);--tint2:rgba(200,50,110,.30)}
body[data-theme="grand"]{--tint:rgba(233,196,106,.28);--tint2:rgba(200,50,110,.32)}
body[data-theme="soft"]{--tint:rgba(90,90,190,.30);--tint2:rgba(200,120,170,.20)}

#backdrop{position:fixed;inset:0;z-index:0;
  background:
   radial-gradient(1100px 700px at 15% -10%,var(--tint),transparent 62%),
   radial-gradient(900px 620px at 110% 108%,var(--tint2),transparent 58%),
   radial-gradient(600px 400px at 50% 50%,rgba(255,255,255,.025),transparent 70%),
   var(--bg);
  transition:background 1.2s ease}
#stars{position:fixed;inset:0;z-index:0;opacity:.55;pointer-events:none;
  background-image:
   radial-gradient(1.2px 1.2px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 82% 12%,#fff,transparent),
   radial-gradient(1.4px 1.4px at 66% 36%,#fff,transparent),radial-gradient(1px 1px at 28% 62%,#fff,transparent),
   radial-gradient(1.3px 1.3px at 92% 70%,#fff,transparent),radial-gradient(1px 1px at 8% 84%,#fff,transparent),
   radial-gradient(1.2px 1.2px at 48% 90%,#fff,transparent),radial-gradient(1px 1px at 40% 8%,#fff,transparent),
   radial-gradient(1.1px 1.1px at 74% 82%,#fff,transparent),radial-gradient(1px 1px at 55% 55%,#fff,transparent);
  animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.7}}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

#progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;background:rgba(255,255,255,.06)}
#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));box-shadow:0 0 12px var(--gold);transition:width .9s cubic-bezier(.2,.8,.2,1)}

#stage{position:fixed;inset:0;z-index:5}
#fx{position:fixed;inset:0;z-index:20;pointer-events:none}
#mute{position:fixed;right:14px;bottom:14px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
  background:rgba(20,10,35,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink);cursor:pointer;font-size:18px;display:grid;place-items:center;transition:.25s}
#mute:hover{border-color:var(--gold);transform:scale(1.06)}

/* ---------- scenes ---------- */
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:calc(clamp(54px,8vh,84px) + env(safe-area-inset-top,0px)) calc(clamp(18px,5vw,64px) + env(safe-area-inset-right,0px)) calc(clamp(28px,5vh,56px) + env(safe-area-inset-bottom,0px)) calc(clamp(18px,5vw,64px) + env(safe-area-inset-left,0px));
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  opacity:0;transform:translateY(26px) scale(.985);filter:blur(8px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1),filter .9s ease}
/* centre the content when it fits, but let it scroll (never clip) when it is taller than the screen */
.scene>:first-child{margin-top:auto}.scene>:last-child{margin-bottom:auto}
.scene.bal{justify-content:center}.scene.bal>.bal-center{margin:auto}
.scene.enter{opacity:1;transform:none;filter:none}
.scene.leave{opacity:0;transform:translateY(-22px) scale(1.01);filter:blur(8px);pointer-events:none}
.chap{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;
  font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;color:var(--mute)}
.chap i{width:38px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* intro stage: countdown + highlighted title (shown first on every page) */
.intro{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3.2vh,30px);text-align:center;width:min(820px,100%);margin:auto 0}
.intro.out{animation:introOut .7s ease forwards}
@keyframes introOut{to{opacity:0;transform:translateY(-18px) scale(.98);filter:blur(6px)}}

/* content: photo + lines + button (revealed after the countdown and title) */
.layout{width:min(1120px,100%);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,72px);align-items:center;margin:auto 0}
.layout.content{display:none}
.layout.content.show{display:grid}
.scene.flip .layout{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}
.scene.flip .frame-wrap{order:2}
/* chapter with no photo: the text sits centred on its own */
.scene .layout.content.textonly{grid-template-columns:minmax(0,1fr);max-width:720px;justify-items:center}
.layout.content.textonly .copy{align-items:center;text-align:center}
.layout.content.textonly .lines{text-align:center}
/* chapter with a video and a slideshow: both frames side by side above the text */
.scene .layout.content.multi{grid-template-columns:minmax(0,1fr);max-width:980px;justify-items:center;gap:26px}
.layout.content.multi .copy{align-items:center;text-align:center}
.layout.content.multi .lines{text-align:center}
.frame-wrap.row{flex-wrap:wrap;gap:22px}
.frame-wrap.row .frame{--maxw:min(440px,44vw);--maxh:calc(var(--vh)*34)}
.frame-wrap{display:flex;justify-content:center}
.content.show .frame-wrap{animation:contentIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes contentIn{from{opacity:0;transform:translateY(26px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.frame{--ar:.8;--maxw:min(440px,34vw);--maxh:min(560px,calc(var(--vh)*60));--fw:min(var(--maxw),calc(var(--maxh)*var(--ar)));position:relative;flex:none;width:var(--fw);height:calc(var(--fw)/var(--ar));transition:width .8s ease,height .8s ease;border-radius:20px;padding:7px;
  background:linear-gradient(140deg,var(--gold-hi),var(--gold) 35%,#7a5516 62%,var(--gold-hi));
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 90px rgba(233,196,106,.16);animation:float 7s ease-in-out infinite}
.frame.wide{--ar:1.6;--maxw:min(560px,44vw);--maxh:min(420px,calc(var(--vh)*56))}
.frame .inner{position:absolute;inset:7px;border-radius:14px;overflow:hidden;background:#150a22}
.frame img,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .slide{opacity:0;transition:opacity 1.2s ease;animation:kb 9s ease-in-out infinite alternate}
.frame .slide.on{opacity:1}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.10) translate(-1.2%,-1%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ph{position:absolute;inset:0;display:grid;place-content:center;gap:8px;text-align:center;padding:18px;
  background:radial-gradient(circle at 30% 20%,rgba(255,143,177,.20),transparent 55%),linear-gradient(160deg,#241038,#12091f);color:var(--mute)}
.ph b{font-family:var(--serif);font-size:2.3rem;color:var(--gold);font-weight:500}
.ph span{font-size:.82rem;letter-spacing:.04em}
.ph small{font-size:.68rem;opacity:.6;letter-spacing:.06em}

.copy{display:flex;flex-direction:column;gap:clamp(14px,2.2vh,22px);align-items:flex-start;min-width:0}
.content.show .copy>:nth-child(1){animation:fadeUp .9s .35s backwards}
.content.show .copy>:nth-child(2){animation:fadeUp .9s .55s backwards}
.content.show .copy>:nth-child(3){animation:fadeUp .9s .8s backwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kicker{font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.heading{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(1.6rem,3.4vw,2.6rem);line-height:1.15;
  background:linear-gradient(100deg,#fff1c1,#e9c46a 40%,#c58f2f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(233,196,106,.35))}
.lines{font-family:var(--serif);font-size:clamp(1.08rem,1.9vw,1.45rem);line-height:1.55;color:var(--ink);font-weight:500}
.lines p+p{margin-top:.7em;color:var(--mute);font-size:.88em;font-family:var(--sans);font-weight:300;line-height:1.7}

.cta{position:relative;align-self:flex-start;cursor:pointer;border:0;border-radius:999px;padding:16px 38px;
  font:600 .95rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#2a1604;
  background:linear-gradient(120deg,var(--gold-hi),var(--gold) 45%,#d19a38);overflow:hidden;
  box-shadow:0 10px 30px rgba(233,196,106,.28),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .25s,box-shadow .25s,opacity .5s}
.cta::before{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2px solid var(--gold);animation:ring 2.2s ease-out infinite;pointer-events:none}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:sheen 3.2s ease-in-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.28,1.7);opacity:0}}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
.cta:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 16px 40px rgba(233,196,106,.42)}
.cta:active{transform:scale(.97)}
.cta.gone{opacity:0;pointer-events:none;transform:scale(.9)}
.content .cta{visibility:hidden;pointer-events:none}
.content .cta.ready{visibility:visible;pointer-events:auto;animation:fadeUp .9s backwards}
.content .cta.ready.gone{pointer-events:none}

.counter{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s}
.counter.in{opacity:1;transform:none}
.counter .row{display:flex;justify-content:center;gap:clamp(8px,1.6vw,16px);flex-wrap:wrap}
.blk{min-width:84px;padding:12px 16px 10px;border-radius:14px;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(233,196,106,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.blk .v{display:block;font:600 clamp(1.9rem,5.4vw,3.3rem)/1.05 var(--serif);font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#c58f2f);-webkit-background-clip:text;background-clip:text;color:transparent}
.blk em{display:block;margin-top:6px;font-style:normal;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
.blk.yr{min-width:118px}.blk.big{min-width:170px}.blk.big .v{font-size:clamp(2.8rem,8vw,4.6rem)}.blk.tm{min-width:128px}
.counter.done .blk{border-color:rgba(233,196,106,.7);box-shadow:0 0 36px rgba(233,196,106,.22)}
.cbar{width:min(420px,100%);height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.cbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold))}

.title{display:none;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(1.9rem,5.2vw,3.6rem);line-height:1.12;
  background:linear-gradient(100deg,#fff1c1,#e9c46a 30%,#fff6d8 50%,#e9c46a 70%,#c58f2f);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(233,196,106,.45))}
.title.show{display:block;animation:reveal 1.1s cubic-bezier(.2,.8,.2,1) both,shimmer 4s linear 1.1s infinite}
@keyframes reveal{from{opacity:0;transform:translateY(16px) scale(.94);letter-spacing:.14em;filter:blur(8px)}to{opacity:1;transform:none;letter-spacing:0}}
@keyframes shimmer{to{background-position:-220% 0}}

/* landing: her name and one button */
.scene.hero{gap:clamp(26px,5vh,46px);text-align:center}
.hero-name{font-family:var(--script);font-size:clamp(4.2rem,17vw,10rem);line-height:1;
  background:linear-gradient(120deg,#fff1c1,#e9c46a,#ff9fbe);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 34px rgba(255,143,177,.4));
  animation:reveal 1.6s cubic-bezier(.2,.8,.2,1) both}
.scene.hero .cta{align-self:center;animation:fadeUp 1s .9s backwards}
.hint{font-size:.72rem;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);animation:fadeUp 1s 1.4s backwards}

/* balloons scene */
.bal-field{position:absolute;inset:0}
.balloon{position:absolute;width:var(--bs);height:calc(var(--bs)*1.2);margin:calc(var(--bs)*-.5) 0 0 calc(var(--bs)*-.5);border-radius:50% 50% 48% 48%;
  background:radial-gradient(circle at 32% 26%,var(--b1),var(--b2) 48%,var(--b3));box-shadow:inset -8px -10px 22px rgba(0,0,0,.18),0 10px 26px rgba(0,0,0,.35);
  display:grid;place-items:center;font:600 calc(var(--bs)*.3)/1 var(--serif);color:rgba(255,255,255,.92);text-shadow:0 1px 4px rgba(0,0,0,.3);
  opacity:0;transform:translateY(80px) scale(.6);animation:balIn .9s cubic-bezier(.2,.8,.2,1) forwards,bob 4.6s ease-in-out infinite;animation-delay:var(--dl),calc(var(--dl) + .9s)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:calc(var(--bs)*.9);background:linear-gradient(rgba(255,255,255,.45),transparent)}
.balloon::before{content:"";position:absolute;left:calc(50% - 5px);top:calc(100% - 3px);border:5px solid transparent;border-bottom-color:var(--b3);border-top:0}
@keyframes balIn{to{opacity:1;transform:none}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}
.balloon.pop{animation:none;opacity:0;transform:scale(1.5);transition:transform .18s ease-out,opacity .18s ease-out}
.bal-center{position:relative;z-index:3;text-align:center;pointer-events:none;padding:20px 34px;border-radius:30px;background:radial-gradient(ellipse,rgba(8,5,15,.78),rgba(8,5,15,.0) 72%)}
.bal-center small{display:block;font-size:.76rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
.bal-center b{display:block;font:600 clamp(5rem,22vw,12rem)/1 var(--serif);
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#c58f2f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(233,196,106,.4))}
.bal-center b.bump{animation:bump .28s ease-out}
@keyframes bump{0%{transform:scale(.86)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.bal-center span{display:block;font:italic 500 clamp(1.1rem,3vw,1.7rem)/1.2 var(--serif);color:var(--ink)}

/* main page */
.scene.main{gap:clamp(12px,2.2vh,22px);text-align:center}
.main-head small{display:block;font-size:.76rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.main-head h1{font:400 clamp(2.6rem,8.5vw,5.6rem)/1.05 var(--script);
  background:linear-gradient(120deg,#fff1c1,#e9c46a 40%,#ff9fbe);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(255,143,177,.35))}
.main-head h2{font:italic 500 clamp(1.4rem,3.6vw,2.2rem)/1.2 var(--serif);margin-top:2px;letter-spacing:.04em}
.showcase{position:relative;display:grid;place-items:center;width:min(100%,640px)}
.showcase .halo{position:absolute;inset:-22px;border-radius:30px;pointer-events:none;
  background:conic-gradient(from 0deg,rgba(255,143,177,.0),rgba(255,143,177,.55),rgba(233,196,106,.0) 30%,rgba(233,196,106,.55) 55%,rgba(167,139,250,.0) 75%,rgba(255,143,177,.0));
  filter:blur(26px);animation:spin 12s linear infinite;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
.showcase .frame{--ar:1.6;--maxw:min(600px,90vw);--maxh:min(380px,calc(var(--vh)*46));animation:none;z-index:2}
.main-lines{max-width:640px;font-family:var(--serif);font-size:clamp(1.02rem,2vw,1.35rem);line-height:1.6;color:var(--ink)}
.main-lines p+p{color:var(--mute);margin-top:.4em;font-size:.88em}
.scene.main .cta{align-self:center}

/* ending */
.scene.end{text-align:center;gap:20px}
.end .big{font:400 clamp(3rem,10vw,6.6rem)/1.05 var(--script);
  background:linear-gradient(120deg,#fff1c1,#e9c46a 40%,#ff9fbe);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,143,177,.35))}
.end .lines{max-width:640px}
.end .sig{font:italic 500 1.2rem var(--serif);color:var(--gold)}
.end .fade{opacity:0;animation:fadeUp 1.1s both}
.scene.end .cta{align-self:center}
.cta.ghost{background:transparent;color:var(--gold);border:1px solid rgba(233,196,106,.6);box-shadow:none}
.cta.ghost::before,.cta.ghost::after{display:none}

/* ---------- phones and small tablets (portrait) ---------- */
@media (max-width:820px){
  .scene{padding-top:calc(52px + env(safe-area-inset-top,0px));padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .layout,.scene.flip .layout{grid-template-columns:minmax(0,1fr);gap:18px}
  .scene.flip .frame-wrap{order:0}
  .frame{--maxw:min(320px,74vw);--maxh:calc(var(--vh)*32)}
  .frame.wide{--maxw:min(440px,88vw);--maxh:calc(var(--vh)*34)}
  .showcase .frame{--maxw:min(440px,88vw);--maxh:calc(var(--vh)*34)}
  .frame-wrap.row{gap:14px}.frame-wrap.row .frame{--maxw:min(420px,86vw);--maxh:calc(var(--vh)*23)}
  .copy{align-items:center;text-align:center;gap:12px}.lines{text-align:center;font-size:1rem}.lines p+p{font-size:.84em;line-height:1.6}
  .kicker{font-size:.66rem;letter-spacing:.24em}
  .heading{font-size:clamp(1.45rem,6.4vw,1.9rem)}
  .cta{align-self:center;max-width:100%;padding:14px 26px;font-size:.8rem;letter-spacing:.1em;line-height:1.25}
  .blk{min-width:70px;padding:10px 10px 8px}.blk.yr{min-width:92px}.blk.big{min-width:132px}.blk.tm{min-width:112px}
  .blk em{letter-spacing:.2em}
  .counter .row{gap:8px}
  .title{font-size:clamp(1.7rem,8vw,2.4rem)}
  .scene.main{gap:12px}.main-lines{font-size:1rem}
  .end .lines{font-size:1.02rem}
  .chap{font-size:.62rem;letter-spacing:.26em;top:calc(16px + env(safe-area-inset-top,0px))}
  #mute{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:40px;height:40px}
}
/* very small phones */
@media (max-width:360px){
  .frame{--maxw:min(280px,72vw)}
  .blk{min-width:62px}.blk.yr{min-width:82px}.blk.tm{min-width:100px}
  .cta{padding:13px 20px;font-size:.74rem}
}
/* phones held sideways: photo on the left, text on the right so nothing needs scrolling */
@media (max-height:520px) and (orientation:landscape){
  .scene{padding-top:calc(38px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .layout,.scene.flip .layout{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px}
  .scene.flip .frame-wrap{order:2}
  .frame{--maxw:min(300px,34vw);--maxh:calc(var(--vh)*68)}
  .frame.wide{--maxw:min(420px,42vw);--maxh:calc(var(--vh)*58)}
  .showcase .frame{--maxw:min(420px,50vw);--maxh:calc(var(--vh)*40)}
  .frame-wrap.row .frame{--maxw:min(300px,40vw);--maxh:calc(var(--vh)*52)}

/* ------------------------------ MEDIA ------------------------------ */
function placeholder(label, path) {
  return el('div', 'ph', '<b>&#9825;</b><span>' + esc(label) + '</span><small>' + esc(path || '') + '</small>');
}
/* The frame follows the photo: it takes the photo's own width/height ratio
   (limited to a sensible range) and stays within the page. */
function setAr(wrap, w, h) {
  const fr = wrap.closest('.frame'); if (!fr || !w || !h) return;
  fr.style.setProperty('--ar', Math.max(.5, Math.min(2.4, w / h)).toFixed(4));
}
function imgNode(src, label) {
  const wrap = el('div', 'inner'); const im = new Image(); im.alt = ''; im.decoding = 'async';
  im.onload = () => setAr(wrap, im.naturalWidth, im.naturalHeight);
  im.onerror = () => { im.remove(); wrap.appendChild(placeholder(label || 'Add your photo here', src)); };
  im.src = src; wrap.appendChild(im); return wrap;
}
function slideshowNode(items, cleanups, label) {
  const wrap = el('div', 'inner'); const slides = [], ars = []; let k = 0;
  const applyAr = n => { if (ars[n]) setAr(wrap, ars[n][0], ars[n][1]); };
  items.forEach((src, i) => {
    const holder = el('div', 'slide' + (i === 0 ? ' on' : '')); holder.style.cssText = 'position:absolute;inset:0';
    const im = new Image(); im.alt = ''; im.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
    im.onload = () => { ars[i] = [im.naturalWidth, im.naturalHeight]; if (i === k) applyAr(i); };
    im.onerror = () => { im.remove(); holder.appendChild(placeholder(label || 'Add a photo', src)); };
    im.src = src; holder.appendChild(im); wrap.appendChild(holder); slides.push(holder);
  });
  const t = setInterval(() => { slides[k].classList.remove('on'); k = (k + 1) % slides.length; slides[k].classList.add('on'); applyAr(k); }, 3400);
  cleanups.push(() => clearInterval(t)); return wrap;
}
function videoNode(src, cleanups, fallbackItems) {
  const wrap = el('div', 'inner'); const v = document.createElement('video');
  v.src = src; v.controls = true; v.playsInline = true; v.preload = 'metadata';
  v.onloadedmetadata = () => setAr(wrap, v.videoWidth, v.videoHeight);
  v.onerror = () => { v.remove(); wrap.appendChild(placeholder('Add your video here', src)); };
  wrap.appendChild(v); return wrap;
}

/* ----------------------------- COUNTER ----------------------------- */
function buildCounter(sc) {
  const d = el('div', 'counter');
  const blk = (k, label, cls) => '<div class="blk ' + (cls || '') + '"><span class="v" data-k="' + k + '">&ndash;&ndash;</span><em>' + label + '</em></div>';
  const row = sc.mode === 'year' ? blk('y', 'Year', 'big')
    : blk('d', 'Day') + blk('m', 'Month') + blk('y', 'Year', 'yr') + (sc.showTime ? blk('t', 'Time', 'tm') : '');
  d.innerHTML = '<div class="row">' + row + '</div><div class="cbar"><i></i></div>';
  return d;
}
function setDisplay(d, sc, ts, p) {
  const D = new Date(ts), q = k => d.querySelector('[data-k="' + k + '"]');
  q('y').textContent = D.getUTCFullYear();
  if (sc.mode !== 'year') {
    const hide = sc.fromYearOnly && p < .015;
    q('d').textContent = hide ? '––' : pad(D.getUTCDate());
    q('m').textContent = hide ? '––' : MONTHS[D.getUTCMonth()];
    if (sc.showTime) { const h = D.getUTCHours(), m = D.getUTCMinutes(); q('t').textContent = pad(((h + 11) % 12) + 1) + ':' + pad(m) + ' ' + (h < 12 ? 'AM' : 'PM'); }
  }
  d.querySelector('.cbar i').style.width = (p * 100) + '%';
}
function roll(d, sc, tokenOk) {
  return new Promise(res => {
    const a = sc.from, b = sc.to, span = Math.abs(b - a) / 864e5;
    const dur = Math.min(9500, Math.max(4300, 3600 + Math.log10(span + 10) * 1900));
    const stopRiser = sfx.riser(dur / 1000);
    const t0 = performance.now(); let lastKey = null, lastYear = null;
    (function frame(now) {
      if (!tokenOk()) { stopRiser(); return res(false); }
      const t = Math.min(1, (now - t0) / dur), p = ease(t), ts = t >= 1 ? b : a + (b - a) * p;
      setDisplay(d, sc, ts, p);
      const yr = new Date(ts).getUTCFullYear();
      const key = sc.mode === 'year' ? yr : Math.floor(ts / 864e5);
      if (key !== lastKey) { const accent = lastYear !== null && yr !== lastYear; lastKey = key; lastYear = yr; if (t < 1) sfx.tick(p, accent); }
      if (t < 1) requestAnimationFrame(frame); else { stopRiser(); sfx.lock(); res(true); }
    })(t0);
  });
}

/* ----------------------------- PAGE FLOW ----------------------------- */
const stage = $('#stage'), progress = $('#progress i'), muteBtn = $('#mute');
const SEQ = SCENES.concat([{ type: 'balloons' }, { type: 'main' }, { type: 'end' }]);
let idx = -1, token = 0, cleanups = [];
const alive = t => () => t === token;
const wait = (ms, t) => new Promise(r => setTimeout(() => r(t === token), ms));
const runCleanup = () => { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; };

function pressButton(btn, t, fn) {
  let used = false;
  btn.addEventListener('click', () => {
    if (used || t !== token) return; used = true;
    sfx.init(); sfx.press(); btn.classList.add('gone');
    setTimeout(() => { if (t === token) fn(); }, 650);
  });
}

function buildHero(sc) {
  const t = token, s = el('section', 'scene hero');
  s.appendChild(el('div', 'hero-name', esc(CONFIG.herName)));
  const btn = el('button', 'cta', esc(sc.cta)); s.appendChild(btn);
  s.appendChild(el('div', 'hint', 'Best with sound on'));
  pressButton(btn, t, advance);
  return s;
}

function buildStory(sc, i) {
  const t = token, total = SCENES.length - 1;
  const s = el('section', 'scene story' + (i % 2 ? ' flip' : ''));
  s.appendChild(el('div', 'chap', '<span>Chapter ' + pad(i) + '</span><i></i><span>of ' + total + '</span>'));

  /* 1) countdown + highlighted title, shown first */
  const intro = el('div', 'intro'), counter = buildCounter(sc), title = el('h2', 'title', esc(sc.title));
  intro.append(counter, title); s.appendChild(intro);

  /* 2) photo + lines + button, revealed after the title */
  let content = null, btn = null;
  if (!sc.final) {
    /* media can be one thing or a list: { video } = a video, { items: [...] } = a photo slideshow */
    const frames = Array.isArray(sc.media) ? sc.media : (sc.media ? [sc.media] : []);
    const hasPic = !!(sc.img || frames.length);     /* a chapter without img/media is text only */
    const multi = frames.length > 1;
    content = el('div', 'layout content' + (hasPic ? '' : ' textonly') + (multi ? ' multi' : ''));
    let fw = null;
    if (hasPic) {
      fw = el('div', 'frame-wrap' + (multi ? ' row' : ''));
      if (frames.length) frames.forEach(m => {
        const fr = el('div', 'frame wide');
        fr.appendChild(m.video ? videoNode(m.video, cleanups) : slideshowNode(m.items || [], cleanups, 'Add your photos'));
        fw.appendChild(fr);
      });
      else { const fr = el('div', 'frame'); fr.appendChild(imgNode(sc.img, 'Add your photo here')); fw.appendChild(fr); }
    }
    const copy = el('div', 'copy');
    btn = el('button', 'cta', esc(sc.cta));
    copy.append(el('div', 'kicker', esc(sc.kicker)), el('h2', 'heading', esc(sc.title)), el('div', 'lines', sc.lines.map(l => '<p>' + esc(l) + '</p>').join('')), btn);
    if (fw) content.append(fw);
    content.append(copy); s.appendChild(content);
    pressButton(btn, t, advance);
  }

  (async () => {
    if (!(await wait(1100, t))) return;
    fx.celebrate(sc.theme, 1);                                   /* celebration as the page opens */
    if (!(await wait(900, t))) return;
    setDisplay(counter, sc, sc.from, 0); counter.classList.add('in');
    if (!(await wait(500, t))) return;
    if (!(await roll(counter, sc, alive(t)))) return;            /* countdown with sound */
    counter.classList.add('done');
    if (!(await wait(450, t))) return;
    title.classList.add('show'); sfx.chime(); sfx.sparkle();     /* highlighted title */
    fx.celebrate(sc.theme, sc.level || 2);
    if (sc.final) { if (!(await wait(5600, t))) return; advance(); return; }
    if (!(await wait(2800, t))) return;
    intro.classList.add('out');
    if (!(await wait(650, t))) return;
    intro.style.display = 'none'; content.classList.add('show'); sfx.reveal();
    if (!(await wait(1700, t))) return;
    btn.classList.add('ready'); sfx.ready();                     /* button appears last */
  })();
  return s;
}

function buildBalloons() {
  const s = el('section', 'scene bal'), field = el('div', 'bal-field'), center = el('div', 'bal-center');
  center.innerHTML = '<small>' + esc(CONFIG.herName) + ' is</small><b>0</b><span>years old</span>';
  s.append(field, center);
  const N = 25, vw = innerWidth, vh = innerHeight, vmin = Math.min(vw, vh), bs = Math.max(46, Math.min(96, vmin * .13));
  const GA = 2.399963, balloons = [], COLS = BALLOON_COLS();
  for (let i = 0; i < N; i++) {
    const r = Math.sqrt((i + 3) / (N + 3)), a = i * GA + .6;
    let x = .5 + Math.cos(a) * r * .46, y = .5 + Math.sin(a) * r * .46 * (vh / vw > 1 ? 1.35 : 1);
    x = Math.max(.07, Math.min(.93, x)); y = Math.max(.12, Math.min(.88, y));
    const col = COLS[i % 5], b = el('div', 'balloon', String(i + 1));
    b.style.cssText = 'left:' + (x * 100) + '%;top:' + (y * 100) + '%;--bs:' + bs + 'px;--b1:' + col[0] + ';--b2:' + col[1] + ';--b3:' + col[2] + ';--dl:' + (i * 55) + 'ms';
    b._col = col; balloons.push(b); field.appendChild(b);
  }
  const t = token;
  (async () => {
    sfx.reveal();
    if (!(await wait(2300, t))) return;
    const age = center.querySelector('b'), lbl = center.querySelector('span');
    for (let i = 0; i < N; i++) {
      const b = balloons[i], rc = b.getBoundingClientRect();
      b.classList.add('pop'); sfx.pop(i);
      fx.popAt(rc.left + rc.width / 2, rc.top + rc.height / 2, b._col);
      age.textContent = i + 1; lbl.textContent = i === 0 ? 'year old' : 'years old';
      age.classList.remove('bump'); void age.offsetWidth; age.classList.add('bump');
      setTimeout(() => b.remove(), 260);
      if (i === N - 2) { if (!(await wait(900, t))) return; }
      else if (!(await wait(Math.max(230, 560 - i * 16), t))) return;
    }
    sfx.fanfare(); fx.celebrate('grand', 3);
    if (!(await wait(4200, t))) return;
    advance();
  })();
  return s;
}
function BALLOON_COLS() { return [['#ffd6e3','#ff7aa8','#c23b6f'], ['#fff1c1','#e9c46a','#b8862b'], ['#e3d4ff','#a78bfa','#6d4fc2'], ['#d3f1ff','#7cc7ee','#3b86b3'], ['#ffffff','#f1e6ee','#b9a3b5']]; }

function buildMain() {
  const s = el('section', 'scene main'), t = token;
  s.innerHTML = '<div class="main-head"><small>' + esc(MAIN.date) + '</small><h1>Happy 25th Birthday</h1><h2>' + esc(CONFIG.herName) + '</h2></div>';
  const showcase = el('div', 'showcase'), fr = el('div', 'frame');
  showcase.appendChild(el('div', 'halo')); fr.appendChild(slideshowNode(MAIN.photos, cleanups, 'Add her photo')); showcase.appendChild(fr); s.appendChild(showcase);
  s.appendChild(el('div', 'main-lines', MAIN.lines.map(l => '<p>' + esc(l) + '</p>').join('')));
  const btn = el('button', 'cta', esc(MAIN.cta)); s.appendChild(btn);
  pressButton(btn, t, advance);
  setTimeout(() => { if (t === token) { sfx.fanfare(); fx.celebrate('birthday', 3); fx.startAmbient('birthday', 1.15); } }, 700);
  cleanups.push(() => fx.stopAmbient());
  return s;
}

function buildEnd() {
  const s = el('section', 'scene end'), t = token;
  s.innerHTML = '<div class="big fade" style="animation-delay:.3s">' + esc(END.big) + ', ' + esc(CONFIG.herName) + '</div>' +
    '<div class="lines fade" style="animation-delay:1.3s">' + END.lines.map(l => '<p>' + esc(l) + '</p>').join('') + '</div>' +
    '<div class="sig fade" style="animation-delay:2.4s">' + esc(END.signoff) + '</div>';
  const b = el('button', 'cta ghost fade', esc(END.replay)); b.style.animationDelay = '3.4s'; s.appendChild(b);
  pressButton(b, t, () => { fx.clear(); show(0); });
  setTimeout(() => { if (t === token) { sfx.chime(); sfx.sparkle(); fx.startAmbient('love', .55, true); } }, 900);
  cleanups.push(() => fx.stopAmbient());
  return s;
}

function show(i) {
  token++; runCleanup(); fx.stopAmbient();
  const sc = SEQ[i], prev = stage.lastElementChild;
  let node;
  if (sc.type === 'balloons') { document.body.dataset.theme = 'grand'; node = buildBalloons(); }
  else if (sc.type === 'main') { document.body.dataset.theme = 'birthday'; node = buildMain(); }
  else if (sc.type === 'end') { document.body.dataset.theme = 'love'; node = buildEnd(); }
  else if (sc.hero) { document.body.dataset.theme = sc.theme; node = buildHero(sc); }
  else { document.body.dataset.theme = sc.theme; node = buildStory(sc, i); }
  stage.appendChild(node);
  requestAnimationFrame(() => requestAnimationFrame(() => node.classList.add('enter')));
  if (prev) { prev.classList.add('leave'); setTimeout(() => prev.remove(), 950); }
  idx = i; progress.style.width = Math.min(100, ((i + 1) / SEQ.length) * 100) + '%';
}
function advance() { if (idx < SEQ.length - 1) { sfx.whoosh(); show(idx + 1); } }

/* unlock audio on the very first touch or click anywhere */
/* phones: use the real visible height (the address bar changes it) instead of plain "vh" */
function setVh() { document.documentElement.style.setProperty('--vh', (window.innerHeight / 100) + 'px'); }
setVh(); addEventListener('resize', setVh); addEventListener('orientationchange', () => setTimeout(setVh, 250));
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, () => sfx.init(), { passive: true }));
muteBtn.addEventListener('click', () => { sfx.on = !sfx.on; muteBtn.style.opacity = sfx.on ? 1 : .45; muteBtn.innerHTML = sfx.on ? '&#9835;' : '&#10005;'; sfx.init(); });

/* start (use ?scene=5 or ?scene=main to jump while testing) */
(function start() {
  const q = new URLSearchParams(location.search).get('scene'); let i = 0;
  if (q) { const names = { balloons: SCENES.length, main: SCENES.length + 1, end: SCENES.length + 2 }; i = q in names ? names[q] : Math.max(0, Math.min(SEQ.length - 1, (parseInt(q, 10) || 1) - 1)); }
  show(i);
})();
})();
</script>
